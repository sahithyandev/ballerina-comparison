openapi: 3.0.3
info:
  title: Blog API
  description: >
    Shared contract for the Ballerina and Go implementations compared in this
    repo. See plan.md for the full criteria list.
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /posts:
    get:
      operationId: listPosts
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPost
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePostRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePost
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: listComments
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PostId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: string }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, username, email, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }

    CreatePostRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1 }
        published: { type: boolean, default: false }

    UpdatePostRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1 }
        published: { type: boolean }

    Post:
      type: object
      required: [id, author_id, title, body, published, created_at]
      properties:
        id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        published: { type: boolean }
        created_at: { type: string, format: date-time }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          required: [author, comments]
          properties:
            author: { $ref: '#/components/schemas/User' }
            comments:
              type: array
              items: { $ref: '#/components/schemas/CommentWithAuthor' }

    PostListResponse:
      type: object
      required: [posts, page, limit, total]
      properties:
        posts:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }

    Comment:
      type: object
      required: [id, post_id, author_id, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        post_id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64 }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CommentWithAuthor:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          required: [author]
          properties:
            author: { $ref: '#/components/schemas/User' }

    CommentListResponse:
      type: object
      required: [comments, page, limit, total]
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/CommentWithAuthor' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
